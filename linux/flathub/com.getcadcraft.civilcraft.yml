# Generated by stores/linux/flatpak.mjs (docs/0.4-PART2.md S.4) for CivilCraft.
id: com.getcadcraft.civilcraft
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: civilcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
# --share=network: CivilCraft fetches map layers and grid files only after the person turns them on (Settings).
modules:
  - name: shell
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/shell/cargo
        CARGO_NET_OFFLINE: "true"
        TAURI_CONFIG: "{\"productName\":\"CivilCraft\",\"mainBinaryName\":\"civilcraft\",\"identifier\":\"com.getcadcraft.civilcraft\",\"version\":\"0.4.0\",\"bundle\":{\"icon\":[\"../com.getcadcraft.civilcraft-128.png\",\"../com.getcadcraft.civilcraft-512.png\"]}}"
    build-commands:
      - cd src-tauri && cargo --offline build --release --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/cadcraft-desktop /app/bin/civilcraft
      - mkdir -p /app/lib/CivilCraft && cp -r edition /app/lib/CivilCraft/app
      - rm -f /app/lib/CivilCraft/app/.htaccess /app/lib/CivilCraft/app/web.config /app/lib/CivilCraft/app/INSTALL.md /app/lib/CivilCraft/app/sw.js
      - install -Dm644 shell.json /app/lib/CivilCraft/shell.json
      - install -Dm644 LICENSE /app/lib/CivilCraft/LICENSE
      - install -Dm644 THIRD_PARTY.md /app/lib/CivilCraft/THIRD_PARTY.md
      - install -Dm644 com.getcadcraft.civilcraft.desktop /app/share/applications/com.getcadcraft.civilcraft.desktop
      - install -Dm644 com.getcadcraft.civilcraft.metainfo.xml /app/share/metainfo/com.getcadcraft.civilcraft.metainfo.xml
      - install -Dm644 com.getcadcraft.civilcraft.svg /app/share/icons/hicolor/scalable/apps/com.getcadcraft.civilcraft.svg
      - install -Dm644 com.getcadcraft.civilcraft-64.png /app/share/icons/hicolor/64x64/apps/com.getcadcraft.civilcraft.png
      - install -Dm644 com.getcadcraft.civilcraft-128.png /app/share/icons/hicolor/128x128/apps/com.getcadcraft.civilcraft.png
      - install -Dm644 com.getcadcraft.civilcraft-256.png /app/share/icons/hicolor/256x256/apps/com.getcadcraft.civilcraft.png
      - install -Dm644 com.getcadcraft.civilcraft-512.png /app/share/icons/hicolor/512x512/apps/com.getcadcraft.civilcraft.png
      - install -Dm644 com.getcadcraft.civilcraft.mime.xml /app/share/mime/packages/com.getcadcraft.civilcraft.xml
    sources:
      - {"type":"git","url":"https://github.com/getcadcraft/desktop-shell.git","tag":"OWNER: shell release tag","commit":"OWNER: commit of that tag"}
      - cargo-sources.json
      - {"type":"archive","url":"https://github.com/getcadcraft/civilcraft/releases/download/civilcraft-v0.4.0/civilcraft-browser-edition-v0.4.0.zip","sha256":"OWNER: SHA-256 from the release SHA256SUMS (edition D.7)","dest":"edition"}
      - { type: file, path: "com.getcadcraft.civilcraft.metainfo.xml" }
      - { type: file, path: "com.getcadcraft.civilcraft.desktop" }
      - { type: file, path: "com.getcadcraft.civilcraft.svg" }
      - { type: file, path: "com.getcadcraft.civilcraft-64.png" }
      - { type: file, path: "com.getcadcraft.civilcraft-128.png" }
      - { type: file, path: "com.getcadcraft.civilcraft-256.png" }
      - { type: file, path: "com.getcadcraft.civilcraft-512.png" }
      - { type: file, path: "THIRD_PARTY.md" }
      - { type: file, path: "shell.json" }
      - { type: file, path: "com.getcadcraft.civilcraft.mime.xml" }
